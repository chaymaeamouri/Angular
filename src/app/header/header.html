<header class="app-header">
  <div class="logo-section">
    <div class="logo-icon">⚡</div>
    <h2>{{ title }}</h2>
    <span class="badge">5Gi Angular</span>
  </div>

  <div class="header-actions">
    <button class="btn btn-secondary" (click)="rename()">
      ✏️ Renommer
    </button>
    <button class="btn btn-danger" [disabled]="!canDelete" (click)="delete()">
      🗑️ Supprimer le titre
    </button>
  </div>
</header>
